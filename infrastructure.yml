AWSTemplateFormatVersion: "2010-09-09"
Description: Capstone 1 - ECS + Lambda + API Gateway + CloudWatch

Parameters:
  ContainerImageUri:
    Type: String
    Description: ECR image URI

Resources:
  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsHostnames: true

  IGW:
    Type: AWS::EC2::InternetGateway

  AttachIGW:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref VPC
      InternetGatewayId: !Ref IGW

  Subnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.1.0/24
      AvailabilityZone: !Select [0, !GetAZs ""]
      MapPublicIpOnLaunch: true

  Subnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.2.0/24
      AvailabilityZone: !Select [1, !GetAZs ""]
      MapPublicIpOnLaunch: true

  RT:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC

  Route:
    Type: AWS::EC2::Route
    DependsOn: AttachIGW
    Properties:
      RouteTableId: !Ref RT
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref IGW

  Assoc1:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref Subnet1
      RouteTableId: !Ref RT

  Assoc2:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref Subnet2
      RouteTableId: !Ref RT

  ALBSG:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: ALB
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0

  ECSSG:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: ECS
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          SourceSecurityGroupId: !Ref ALBSG

  ALB:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: capstone-alb
      Scheme: internet-facing
      Type: application
      SecurityGroups:
        - !Ref ALBSG
      Subnets:
        - !Ref Subnet1
        - !Ref Subnet2

  TG:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Port: 80
      Protocol: HTTP
      VpcId: !Ref VPC
      TargetType: ip
      HealthCheckPath: /

  Listener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref ALB
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref TG

  Cluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: capstone-cluster

  ECSRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy

  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /ecs/capstone-webapp
      RetentionInDays: 7

  TaskDef:
    Type: AWS::ECS::TaskDefinition
    Properties:
      NetworkMode: awsvpc
      RequiresCompatibilities:
        - FARGATE
      Cpu: "256"
      Memory: "512"
      ExecutionRoleArn: !Ref ECSRole
      ContainerDefinitions:
        - Name: webapp
          Image: !Ref ContainerImageUri
          Essential: true
          PortMappings:
            - ContainerPort: 80
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: /ecs/capstone-webapp
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: ecs

  Service:
    Type: AWS::ECS::Service
    DependsOn: Listener
    Properties:
      Cluster: !Ref Cluster
      TaskDefinition: !Ref TaskDef
      LaunchType: FARGATE
      DesiredCount: 2
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          SecurityGroups:
            - !Ref ECSSG
          Subnets:
            - !Ref Subnet1
            - !Ref Subnet2
      LoadBalancers:
        - ContainerName: webapp
          ContainerPort: 80
          TargetGroupArn: !Ref TG

  LambdaRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole

  LambdaFn:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: capstone-api-handler
      Runtime: python3.12
      Handler: lambda_function.lambda_handler
      Role: !GetAtt LambdaRole.Arn
      Timeout: 10
      Code:
        ZipFile: |
          import json, logging, uuid
          logger = logging.getLogger()
          logger.setLevel(logging.INFO)
          def lambda_handler(event, context):
              logger.info("Request received")
              body = json.loads(event["body"]) if event.get("body") else {}
              name = body.get("name", "").strip()
              if not name:
                  return {"statusCode": 400, "headers": {"Content-Type": "application/json", "Access-Control-Allow-Origin": "*"}, "body": json.dumps({"error": "name is required"})}
              sid = str(uuid.uuid4())
              return {"statusCode": 200, "headers": {"Content-Type": "application/json", "Access-Control-Allow-Origin": "*"}, "body": json.dumps({"message": "Success!", "id": sid, "received": {"name": name}})}

  Api:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name: capstone-api
      EndpointConfiguration:
        Types:
          - REGIONAL

  ApiRes:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref Api
      ParentId: !GetAtt Api.RootResourceId
      PathPart: submit

  ApiMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref Api
      ResourceId: !Ref ApiRes
      HttpMethod: POST
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${LambdaFn.Arn}/invocations"

  ApiDeploy:
    Type: AWS::ApiGateway::Deployment
    DependsOn: ApiMethod
    Properties:
      RestApiId: !Ref Api
      StageName: prod

  LambdaPerm:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref LambdaFn
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${Api}/*/POST/submit"

  Dashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: capstone-dashboard
      DashboardBody: !Sub |
        {"widgets":[
        {"type":"metric","x":0,"y":0,"width":12,"height":6,"properties":{"title":"Invocations","metrics":[["AWS/Lambda","Invocations","FunctionName","capstone-api-handler",{"stat":"Sum"}]],"region":"${AWS::Region}"}},
        {"type":"metric","x":12,"y":0,"width":12,"height":6,"properties":{"title":"Errors","metrics":[["AWS/Lambda","Errors","FunctionName","capstone-api-handler",{"stat":"Sum"}]],"region":"${AWS::Region}"}},
        {"type":"metric","x":0,"y":6,"width":12,"height":6,"properties":{"title":"Duration","metrics":[["AWS/Lambda","Duration","FunctionName","capstone-api-handler",{"stat":"Average"}]],"region":"${AWS::Region}"}},
        {"type":"log","x":0,"y":12,"width":24,"height":6,"properties":{"title":"Logs","query":"SOURCE '/aws/lambda/capstone-api-handler' | fields @timestamp, @message | sort @timestamp desc | limit 20","region":"${AWS::Region}"}}
        ]}

Outputs:
  WebsiteURL:
    Description: Web app URL
    Value: !GetAtt ALB.DNSName
  ApiURL:
    Description: API endpoint
    Value: !Sub "https://${Api}.execute-api.${AWS::Region}.amazonaws.com/prod/submit"
